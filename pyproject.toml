[project]
name = "roadguardian-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "gradio-client>=2.5.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.24.0",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "ultralytics>=8.4.93",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Sin esto, los tests no pueden importar prioritization/ ni api/: pytest no
# añade la raíz del proyecto al sys.path por su cuenta.
pythonpath = ["."]
testpaths = ["tests"]
